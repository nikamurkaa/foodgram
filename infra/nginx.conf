server {
    listen 80;
    server_name kirta-security.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kirta-security.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kirta-security.ru;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/kirta-security.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirta-security.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /api/docs/ {
        rewrite ^ /api/docs/redoc.html last;
    }

    location /api/docs/ {
        alias /usr/share/nginx/docs/;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /s/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /static/admin/ {
        alias /var/html/static/admin/;
    }

    location /static/rest_framework/ {
        alias /var/html/static/rest_framework/;
    }

    location /static/ {
        root /usr/share/nginx/html/build;
        try_files $uri =404;
    }

    location /media/ {
        alias /var/html/media/;
    }

    location / {
        root /usr/share/nginx/html/build;
        index index.html;
        try_files $uri /index.html;
    }
}
