name: Frontend security

on:
  push:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-security.yml'
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-security.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Keep npm 6 for lockfile v1
        run: npm install --global npm@6.14.18

      - name: Apply non-breaking fixes on security branches
        if: startsWith(github.ref_name, 'security-deps-')
        working-directory: frontend
        continue-on-error: true
        run: npm audit fix --package-lock-only

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Require zero high or critical findings
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Commit safe lockfile fixes
        if: startsWith(github.ref_name, 'security-deps-')
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix: update vulnerable frontend dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
