name: Frontend security

on:
  push:
    paths:
      - 'frontend/**'
      - 'infra/frontend.Dockerfile'
      - '.github/workflows/frontend-security.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'infra/frontend.Dockerfile'
      - '.github/workflows/frontend-security.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Migration branches rebuild the lockfile from the new Vite dependency tree.
      - name: Refresh lockfile on Vite migration branches
        if: startsWith(github.ref_name, 'security-vite-migration-')
        working-directory: frontend
        run: npm install --package-lock-only

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Require zero high or critical findings
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Commit regenerated lockfile
        if: startsWith(github.ref_name, 'security-vite-migration-') && github.event_name == 'push'
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "build: regenerate frontend lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
